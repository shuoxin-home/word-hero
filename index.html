<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>单词小勇士</title>
<meta name="theme-color" content="#FFC93C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="单词小勇士">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
<div id="boot" style="font:700 22px sans-serif;padding:24px;">🦁 单词小勇士 · 加载中…</div>
<style>
:root{
  --bg:#FFF8EC; --card:#FFFFFF; --ink:#2D3047; --ink2:#6B6F85; --line:#F0E4D2;
  --blue:#4F8DF7; --blue-d:#3A73D8; --blue-l:#E6EFFE;
  --green:#2FBF71; --green-d:#23995A; --green-bg:#E3F8EC;
  --orange:#FF9F43; --orange-d:#D9801F; --orange-bg:#FFF1E2;
  --yellow:#FFC93C; --yellow-d:#E0A800; --yellow-bg:#FFF6D6;
  --purple:#8C6CF2; --purple-bg:#F0EBFF; --grey-bg:#F3F1EC;
  --en:'Andika','Comic Sans MS','Segoe UI',Arial,sans-serif;
  --zh:'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--zh);overscroll-behavior-y:contain;-webkit-tap-highlight-color:transparent;}
#boot{display:none}
button{font-family:inherit;cursor:pointer;border:none;color:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:disabled{cursor:default}
#app{position:relative;max-width:760px;margin:0 auto;padding:16px 16px 32px;overflow:hidden}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.cf{position:absolute;top:-40px}
.cf.go{animation:fall 2.6s ease-in forwards}
@keyframes fall{to{transform:translateY(760px) rotate(340deg);opacity:0}}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.brand{font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--card);display:inline-flex;align-items:center;justify-content:center;font-size:32px;box-shadow:0 3px 0 var(--line)}
.pills{display:flex;gap:8px}
.pill{background:var(--card);border-radius:999px;padding:8px 14px;font-weight:800;box-shadow:0 3px 0 var(--line);display:inline-flex;gap:6px;align-items:center;font-size:16px;white-space:nowrap}
.card{background:var(--card);border-radius:24px;padding:22px;box-shadow:0 4px 0 var(--line);margin-bottom:16px}
.center{text-align:center}
h2{margin:6px 0 14px;font-size:26px}
h3{margin:0 0 6px;font-size:20px}
.muted{color:var(--ink2)} .small{font-size:14px;line-height:1.5}
.btn{min-height:56px;padding:0 26px;border-radius:18px;font-size:20px;font-weight:800;color:#fff;background:var(--blue);box-shadow:0 5px 0 var(--blue-d);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--blue-d)}
.btn.green{background:var(--green);box-shadow:0 5px 0 var(--green-d)}
.btn.orange{background:var(--orange);box-shadow:0 5px 0 var(--orange-d)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.big{min-height:72px;font-size:26px;width:100%}
.btn.sm{min-height:44px;font-size:16px;padding:0 16px;border-radius:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.task-row{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.chip{border-radius:16px;padding:12px 16px;font-size:18px;font-weight:700;flex:1;min-width:140px}
.chip b{font-size:28px;margin-left:6px}
.chip.blue{background:var(--blue-l)} .chip.yellow{background:var(--yellow-bg)}
.all-done{background:var(--green-bg);border-radius:16px;padding:18px;font-size:20px;font-weight:700;margin-bottom:12px}
.shelf{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0 10px}
.box{border-radius:16px;padding:12px 4px;text-align:center}
.box-n{font-size:28px;font-weight:800}
.box-l{font-size:14px;font-weight:700}
.box-d{font-size:12px;color:var(--ink2)}
.b1{background:var(--orange-bg)} .b2{background:var(--yellow-bg)} .b3{background:var(--green-bg)}
.b4{background:var(--blue-l)} .b5{background:var(--purple-bg)} .trophy{background:linear-gradient(160deg,#FFE58A,#FFC93C)}
.sess-top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.x{width:48px;height:48px;border-radius:50%;background:var(--card);font-size:20px;box-shadow:0 3px 0 var(--line);flex:none}
.bar{flex:1;height:18px;background:var(--grey-bg);border-radius:999px;overflow:hidden}
.bar>div{height:100%;background:linear-gradient(90deg,var(--green),#7BE0A6);border-radius:999px;transition:width .3s}
.tag{display:inline-block;background:var(--purple-bg);color:var(--purple);font-weight:800;border-radius:999px;padding:4px 14px;font-size:15px}
.q{font-size:22px;font-weight:800;margin:4px 0 12px}
.pic{font-size:104px;line-height:1.15;margin:6px 0}
.letter-pic{width:120px;height:120px;margin:8px auto;border-radius:28px;background:var(--blue-l);color:var(--blue-d);font:700 72px var(--en);display:flex;align-items:center;justify-content:center}
.word-big{font-family:var(--en);font-size:62px;font-weight:700;letter-spacing:1px;line-height:1.2;overflow-wrap:anywhere}
.word-big.phrase{font-size:48px}
.zh{font-size:24px;color:var(--ink2);margin:4px 0 12px}
.speak{width:68px;height:68px;border-radius:50%;background:var(--yellow);font-size:30px;box-shadow:0 4px 0 var(--yellow-d);margin:6px}
.speak.xl{width:96px;height:96px;font-size:44px}
.speak.sm{width:44px;height:44px;font-size:20px;vertical-align:middle;margin:0 4px}
.hint{color:var(--ink2);margin:6px 0 18px}
.opt-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:14px}
.opt{background:var(--card);border:3px solid var(--line);border-radius:20px;min-height:120px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 4px 0 var(--line)}
.opt .emo{font-size:58px;line-height:1.1}
.opt .ozh{font-size:16px;color:var(--ink2)}
.opt .ozh.big{font-size:24px;color:var(--ink);font-weight:700}
.opt.en{font-family:var(--en);font-size:32px;font-weight:700;min-height:88px;line-height:1.15;overflow-wrap:anywhere}
.opt.right{border-color:var(--green);background:var(--green-bg)}
.opt.wrong{border-color:var(--orange);background:var(--orange-bg)}
.slots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;min-height:84px;padding:10px;border:3px dashed var(--line);border-radius:18px;margin:14px 0}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:8px}
.tile{min-width:58px;height:62px;padding:0 14px;border-radius:14px;background:var(--card);border:3px solid var(--blue);color:var(--blue-d);font-family:var(--en);font-size:32px;font-weight:700;box-shadow:0 4px 0 #C9DAFC}
.tile.used{visibility:hidden}
.tile.placed{background:var(--blue);color:#fff}
.blanks{font-family:var(--en);font-size:30px;letter-spacing:4px;color:var(--ink2);margin:6px 0 12px}
.type-in{width:100%;height:80px;border-radius:18px;border:3px solid var(--line);font-family:var(--en);font-size:40px;text-align:center;outline:none;margin-bottom:14px;color:var(--ink)}
.type-in:focus{border-color:var(--blue)}
.fb{border-radius:20px;padding:18px;margin-top:18px;text-align:center}
.fb.ok{background:var(--green-bg);border:3px solid var(--green)}
.fb.retry{background:var(--orange-bg);border:3px solid var(--orange)}
.fb-t{font-size:22px;font-weight:800;margin-bottom:8px}
.fb-w{font-size:22px;margin-bottom:10px}
.fb-w b{font-family:var(--en);font-size:32px}
.fb .btn{margin-top:8px;min-width:200px}
.yours{font-family:var(--en);text-decoration:line-through;color:var(--orange-d)}
.learned{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0}
.wchip{background:var(--blue-l);border-radius:999px;padding:8px 14px;font-family:var(--en);font-size:20px;font-weight:700}
.rest{background:var(--yellow-bg);border-radius:16px;padding:14px;font-size:18px;margin:14px 0 18px}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:2px solid var(--grey-bg)}
.list-item .e{font-size:36px;width:48px;text-align:center}
.list-item .w{font-family:var(--en);font-size:26px;font-weight:700}
.list-item .grow{flex:1}
/* parent */
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{padding:10px 18px;border-radius:14px;background:var(--card);font-size:16px;font-weight:700;box-shadow:0 3px 0 var(--line)}
.tabs button.on{background:var(--ink);color:#fff}
label.f{display:block;font-weight:700;margin:12px 0 6px}
input.t,textarea.t{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;font-family:var(--zh);color:var(--ink);outline:none}
textarea.t{font-family:var(--en);font-size:17px;line-height:1.6}
input.t:focus,textarea.t:focus{border-color:var(--blue)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{padding:10px 14px;border-radius:12px;background:var(--grey-bg);font-weight:700;font-size:15px}
.seg button.on{background:var(--blue);color:#fff}
.av button{font-size:28px;width:52px;height:52px;padding:0}
code{background:var(--grey-bg);padding:2px 6px;border-radius:6px;font-family:var(--en)}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;color:var(--ink2);font-weight:600;padding:8px;border-bottom:2px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--grey-bg)}
td.en{font-family:var(--en);font-size:18px;font-weight:700}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700}
.badge.new{background:var(--grey-bg);color:var(--ink2)}
.badge.box{background:var(--blue-l);color:var(--blue-d)}
.badge.done{background:var(--green-bg);color:var(--green-d)}
.badge.warn{background:var(--orange-bg);color:var(--orange-d)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--grey-bg);border-radius:16px;padding:12px;text-align:center}
.stat b{display:block;font-size:26px}
.stat span{font-size:13px;color:var(--ink2)}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font-weight:700;z-index:20;max-width:90%;text-align:center}
.mic{width:120px;height:120px;border-radius:50%;background:var(--orange);color:#fff;font-size:54px;box-shadow:0 6px 0 var(--orange-d);margin:12px auto 6px;display:flex;align-items:center;justify-content:center;position:relative}
.mic.on{background:#FF6B6B;box-shadow:0 6px 0 #D94F4F}
.mic.on::after{content:'';position:absolute;inset:-10px;border-radius:50%;border:4px solid #FF6B6B;animation:ring 1.2s ease-out infinite}
@keyframes ring{from{transform:scale(.9);opacity:.9}to{transform:scale(1.25);opacity:0}}
.live{min-height:40px;font-family:var(--en);font-size:28px;color:var(--ink2);margin:6px 0 10px}
.stars3{font-size:44px;letter-spacing:6px;margin:8px 0 4px}
.stars3 .off{filter:grayscale(1);opacity:.3}
.heard{font-size:18px;margin:6px 0 8px}
.heard b{font-family:var(--en);font-size:26px}
.pw{display:inline-block;font-family:var(--en);font-size:28px;font-weight:700;padding:2px 10px;border-radius:10px;margin:3px}
.pw.ok{background:var(--green-bg);color:var(--green-d)} .pw.miss{background:var(--orange-bg);color:var(--orange-d)}
.notice{background:var(--yellow-bg);border-radius:14px;padding:10px 14px;font-size:15px;margin:10px 0;text-align:left;line-height:1.5}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.share-box{margin-top:12px;font-family:var(--en);font-size:13px;line-height:1.4;color:var(--ink2);resize:none;word-break:break-all}
label.btn{cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.check{display:flex;gap:8px;align-items:center;font-size:15px;margin:12px 0 4px}
.check input{width:22px;height:22px}
.grow{flex:1;min-width:150px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tcard,.review-card{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:var(--grey-bg);margin-bottom:10px;flex-wrap:wrap}
.review-card{background:var(--orange-bg);border:2px solid var(--orange)}
.trow{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:2px solid var(--grey-bg);flex-wrap:wrap}
.ticon{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:32px;flex:none}
.ticon.sm{width:44px;height:44px;font-size:24px;border-radius:12px}
.tname{font-size:19px;font-weight:800;margin-bottom:2px}
.bar.thin{height:10px;margin-top:6px}
.badge.req{background:var(--orange-bg);color:var(--orange-d)} .badge.opt{background:var(--blue-l);color:var(--blue-d)}
.tops{display:flex;gap:6px}
.ib{min-width:40px;height:40px;border-radius:12px;background:var(--grey-bg);font-weight:700;padding:0 10px;font-size:15px}
.ib:disabled{opacity:.35}
select.t{height:46px;background:#fff}
.kbshow{display:flex;align-items:center;justify-content:center;min-height:80px;line-height:1.1;word-break:break-all}
.kbshow .caret{display:inline-block;width:3px;height:44px;background:var(--blue);margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.kb{display:flex;flex-direction:column;gap:8px;margin:4px 0 14px}
.kb-row{display:flex;gap:6px;justify-content:center}
.kb button{flex:1;max-width:64px;height:58px;border-radius:12px;background:var(--card);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font:700 26px var(--en);color:var(--ink);padding:0}
.kb button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.kb button.wide{max-width:none;flex:3;font-size:18px;font-family:var(--zh)}
.kb button.fn{background:var(--grey-bg);font-size:20px}
.diag{margin:12px 0 4px;text-align:left}
.diag-row{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--grey-bg);font-size:14px;line-height:1.5}
.diag-row .ic{flex:none;width:22px}
.diag-row b{flex:none;min-width:92px}
.diag-step{background:var(--blue-l);border-radius:12px;padding:10px 12px;font-weight:700;margin:10px 0}
.diag-con{background:var(--grey-bg);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:14px;line-height:1.6}
.avatar.btnav{border:none;cursor:pointer;padding:0}
.avatar.fr-rare,.av-face.fr-rare{box-shadow:0 0 0 3px #4F8DF7,0 3px 0 var(--line)}
.avatar.fr-epic,.av-face.fr-epic{box-shadow:0 0 0 3px #8C6CF2,0 3px 0 var(--line)}
.avatar.fr-leg,.av-face.fr-leg{box-shadow:0 0 0 3px #FFC93C,0 0 14px 3px rgba(255,201,60,.65)}
@media (prefers-reduced-motion: no-preference){ .avatar.fr-leg,.av-face.fr-leg{animation:glow 2s ease-in-out infinite} }
@keyframes glow{50%{box-shadow:0 0 0 3px #FF9F43,0 0 20px 6px rgba(255,159,67,.7)}}
.title-tag{font-size:13px;font-weight:800;border-radius:999px;padding:2px 10px;margin-left:4px;vertical-align:middle}
.tt-rare{background:var(--blue-l);color:var(--blue-d)} .tt-epic{background:var(--purple-bg);color:var(--purple)} .tt-leg{background:var(--yellow-bg);color:#B07800}
.goal{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.goal .big-emo{font-size:46px;line-height:1}
.shop-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tier-h{display:flex;align-items:center;gap:8px;margin:4px 0 10px}
.tier-h .price{font-size:15px;font-weight:700;color:var(--ink2)}
.av-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.av-tile{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 3px 0 var(--line)}
.av-tile.cur{border-color:var(--green);background:var(--green-bg)}
.av-tile.lock{opacity:.55}
.av-face{width:58px;height:58px;border-radius:50%;background:var(--grey-bg);display:flex;align-items:center;justify-content:center;font-size:36px}
.av-name{font-size:14px;font-weight:700}
.av-st{font-size:13px;font-weight:800;color:var(--ink2)}
.av-st.ok{color:var(--green-d)} .av-st.buy{color:var(--orange-d)}
.confirm{background:var(--yellow-bg);border:3px solid var(--yellow);border-radius:20px;padding:16px;text-align:center;margin-bottom:16px}
.confirm .big-emo{font-size:70px;line-height:1.1}
.sent{font-family:var(--en);font-size:30px;font-weight:700;line-height:1.6;margin:14px 6px 4px}
.blank{display:inline-block;border-bottom:4px solid var(--blue);margin:0 6px;line-height:1.2}
.blank.done{color:var(--green-d);border-bottom-color:var(--green)}
.sent-zh{font-size:19px;margin-bottom:6px}
.fb-ex{font-family:var(--en);font-size:22px;margin:-2px 0 10px}
.tcard .acts{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.btn.dict{background:var(--purple);box-shadow:0 5px 0 #6B4FD0;color:#fff}
.btn.sm.dict{box-shadow:0 4px 0 #6B4FD0}
.dict-tag{display:inline-block;background:var(--purple-bg);color:var(--purple);font-weight:800;border-radius:999px;padding:2px 10px;font-size:13px}
.d-num{font-size:22px;font-weight:800;color:var(--ink2);margin:4px 0}
.d-zh{font-size:34px;font-weight:800;margin:14px 0 6px;line-height:1.35}
.d-paper{font-size:80px;font-weight:800;color:var(--purple);line-height:1.1;margin:10px 0}
.rw-box{background:var(--yellow-bg);border-radius:16px;padding:12px 16px;text-align:left;font-size:15px;line-height:1.8;margin:12px 0}
.rw-row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed #F0D98A;padding:2px 0}
.rw-row:last-child{border-bottom:none;font-weight:800;font-size:18px}
.score-big{font-size:46px;font-weight:800;line-height:1.1;margin:6px 0}
.medal{font-size:84px;line-height:1.1}
.dw-item{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:2px solid var(--grey-bg);text-align:left;flex-wrap:wrap}
.dw-item .w{font-family:var(--en);font-size:22px;font-weight:700}
.chk-row{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--grey-bg)}
.chk-row .n{width:30px;font-weight:800;color:var(--ink2)}
.chk-row .w{flex:1;font-family:var(--en);font-size:20px;font-weight:700}
.chk-row .seg button{padding:8px 12px}
.badge.dict{background:var(--purple-bg);color:var(--purple)}
@media (max-width:560px){
  .d-zh{font-size:26px}
  .tcard .acts{width:100%}
  .sent{font-size:23px}
  .av-grid{grid-template-columns:repeat(3,1fr)}
  .kb button{height:48px;font-size:22px}
  .tcard .btn{width:100%}
  .shelf{grid-template-columns:repeat(3,1fr)}
  .stats{grid-template-columns:repeat(2,1fr)}
  .word-big{font-size:46px}.word-big.phrase{font-size:36px}
  .pic{font-size:84px}
}

.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
.tw table{min-width:100%}
/* ---- 手机竖屏（宽度 ≤ 480） ---- */
@media (max-width:480px){
  #app{padding:10px 10px 24px}
  .card{padding:16px 14px;border-radius:20px;margin-bottom:12px}
  h2{font-size:22px;margin:4px 0 10px}
  .brand{font-size:18px;gap:8px} .avatar{width:44px;height:44px;font-size:26px}
  .pill{padding:6px 10px;font-size:14px}
  .btn{min-height:52px;font-size:18px;padding:0 18px}
  .btn.big{min-height:64px;font-size:22px}

  if (rs.mode === 'review' && rs.tid && !TK(rs.tid)) return false;
  // 家长改过词表时，去掉已经不存在的词
  const valid = k => { const [tid, wid] = splitKey(String(k)), t = TK(tid); return !!(t && t.words.some(w => w.id === wid)); };
  let i = Number(rs.i) || 0; const items = [];
  rs.tasks.forEach((t, j) => { if (t && t.type !== 'speak' && valid(t.id)) items.push({ type: t.type, id: t.id, retry: t.retry || 0 }); else if (j < rs.i) i--; });
  const newIds = (rs.newIds || []).filter(valid), reviewIds = (rs.reviewIds || []).filter(valid);
  if (!items.length || (!newIds.length && !reviewIds.length)) { delete S.resume[key]; save(); return false; }
  SESS = { mode: rs.mode, tid: rs.tid || null, tasks: items, i: Math.max(0, i), results: rs.results || {},
    stars: Number(rs.stars) || 0, newIds, reviewIds, fb: null, tok: 0 };

}

function start(mode, tid) {
  stopSpeech(true);
  if (mode === 'task') {
    const t = TK(tid); if (!t) return;
    // 优先级：没做完的复习 → 没做完的新词 → 这个任务到期的复习 → 新词
    if (S.resume && S.resume['review:' + tid] && restoreSess(S.resume['review:' + tid])) return resumeGo();
    if (S.resume && S.resume['task:' + tid] && restoreSess(S.resume['task:' + tid])) return resumeGo();
    if (dueOf(t).length) mode = 'review';
  } else {
    const rs = (S.resume || {})[sessKey(mode, tid)];
    if (rs && restoreSess(rs)) return resumeGo();
  }
  const g = GRADE[S.settings.grade]; let items = [], newIds = [], reviewIds = [], task = null;
  if (mode === 'review') {
    task = tid ? TK(tid) : null;
    reviewIds = shuffle(task ? dueOf(task) : dueReviews()).slice(0, REVIEW_BATCH);   // 一次最多复习 20 个，多的分几次做
    reviewIds.forEach(k => items.push(mk(g.recall, k)));
  } else if (mode === 'task') {
    task = TK(tid); if (!task) return;
    newIds = pickNew(task);
    newIds.forEach(k => items.push(mk('card', k)));
    const steps = g.steps.slice();
    if (S.settings.sentOn !== false) steps.splice(steps.indexOf('pick') + 1, 0, 'sent');   // 看图选词之后：句子填空
    steps.forEach(st => shuffle(newIds).forEach(k => { if (st === 'sent' && !(W(k).ex || []).length) return; items.push(mk(st, k)); }));
  } else {
    reviewIds = wrongList();
    reviewIds.forEach(k => items.push(mk('card', k)));
    shuffle(reviewIds).forEach(k => items.push(mk('pick', k)));
    shuffle(reviewIds).forEach(k => items.push(mk(g.recall, k)));
  }
  if (!items.length) { toast('现在没有要练的单词啦'); return; }
  SESS = { mode, tid: task ? task.id : null, tasks: items, i: 0, results: {}, stars: 0, newIds, reviewIds, fb: null, tok: 0 };

}
function resumeGo() {

}

/* ---- 答对后：点"继续"进入下一题；3 秒没人点就自动进入 ---- */
const AUTO_NEXT = 3;
let CD_TIMER = null;
function startCountdown(guard, go) {
  clearTimeout(CD_TIMER);
  const tok = SESS.tok = Math.random(); SESS.cd = AUTO_NEXT;
  const tick = () => {
    if (!SESS || SESS.tok !== tok || view !== 'session' || !guard()) return;
    SESS.cd--;
    if (SESS.cd <= 0) { go(); return; }
    const el = document.getElementById('cdn'); if (el) el.textContent = SESS.cd;
    CD_TIMER = setTimeout(tick, 1000);
  };
  CD_TIMER = setTimeout(tick, 1000);
}
const cdHint = () => `<div class="muted small" style="margin-top:8px"><span id="cdn">${SESS.cd || AUTO_NEXT}</span> 秒后自动进入下一题</div>`;

const sayText = t => (t && t.type === 'sent' && t.ex) ? t.ex.en : W(t.id).en;
function answer(ok, yours) {
  if (SESS.fb) return;
  const t = curTask(), w = W(t.id), p = prog(t.id);
  const r = SESS.results[t.id] || (SESS.results[t.id] = { errors: 0 });
  if (ok) {
    const gain = (t.retry === 0 && !t.hinted) ? 1 : 0;
    SESS.stars += gain; addStars(gain); p.right++;
    SESS.fb = { ok: true, gain }; sfx.ok(); setTimeout(() => speak(sayText(t)), 380);
    startCountdown(() => !!(SESS && SESS.fb && SESS.fb.ok), next);
  } else {
    r.errors++; p.wrong++; p.inWrong = true;
    if (t.retry < 2) SESS.tasks.splice(Math.min(SESS.i + 3, SESS.tasks.length), 0, { type: t.type, id: t.id, retry: t.retry + 1 });
    SESS.fb = { ok: false, yours }; sfx.retry(); setTimeout(() => speak(sayText(t)), 450);
  }
  persistSess(true); render();
}

function next() {
  if (!SESS) return;
  stopSpeech(true); clearTimeout(CD_TIMER);
  SESS.fb = null; SESS.tok = 0; SESS.i++;
  if (SESS.i >= SESS.tasks.length) finish(); else { persistSess(false); render(); }
}

function finish() {
  const t0 = today();
  if (S.resume) delete S.resume[sessKey(SESS.mode, SESS.tid)];
  if (SESS.mode === 'task') {
    SESS.newIds.forEach(k => { const p = prog(k); p.box = 1; p.due = addDays(t0, 1); });
    const tk = TK(SESS.tid); if (tk) tDaily(tk).newDone += SESS.newIds.length;
  } else if (SESS.mode === 'review') {
    SESS.reviewIds.forEach(k => {
      const p = prog(k), e = (SESS.results[k] || {}).errors || 0;
      if (!e) { p.box = Math.min(6, p.box + 1); p.due = p.box === 6 ? null : addDays(t0, INTERVAL[p.box]); p.inWrong = false; }
      else { p.box = 1; p.due = addDays(t0, 1); }
    });
  } else {
    SESS.reviewIds.forEach(k => { if (!((SESS.results[k] || {}).errors)) prog(k).inWrong = false; });
  }
  SESS.dayDone = false;
  if (S.lastStudy !== t0 && dayComplete()) {
    S.streak = (S.lastStudy === addDays(t0, -1)) ? S.streak + 1 : 1; S.lastStudy = t0; SESS.dayDone = true;
  }
  const before = Math.max(0, S.stars - SESS.stars);   // 这一轮开始前的星星
  SESS.stars += 3; addStars(3); SESS.newAv = nextGoal(before) && !nextGoal(before).ok && nextGoal().ok; save(); sfx.done();
  view = 'done'; render(); confetti();
}

/* ========== 跟读口语 ========== */
const CANON = {};
[['two','to','too','2'],['four','for','4'],['eight','ate','8'],['one','won','1'],['three','3'],['five','5'],['six','6'],['seven','7'],['nine','9'],['ten','10'],
 ['bee','be','b'],['tea','tee','t'],['eye','i','aye'],['pear','pair','pare'],['sea','see','c'],['sun','son'],['hi','high'],['bye','by','buy'],
 ['right','write'],['flower','flour'],['night','knight'],['hear','here'],['blue','blew'],['no','know'],['meet','meat'],['week','weak'],['ok','okay']
].forEach(g => g.forEach(x => CANON[x] = g[0]));
const canon = s => String(s).toLowerCase().replace(/[’`]/g, "'").replace(/[^a-z0-9' \-]/g, ' ').replace(/-/g, ' ').split(' ').filter(Boolean).map(x => CANON[x] || x).join(' ');
function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; }
  return prev[n];
}
const simStr = (a, b) => (a.length || b.length) ? 1 - lev(a, b) / Math.max(a.length, b.length) : 0;
function scoreSpeech(alts, target) {
  const tg = canon(target), tw = tg.split(' '), tgc = tg.replace(/ /g, '');
  let best = { sim: 0, said: '' };
  alts.forEach(raw => {
    const a = canon(raw); if (!a) return;
    const aw = a.split(' ');
    let sim;
    if ((' ' + a + ' ').includes(' ' + tg + ' ')) sim = 1;
    else if (tw.length === 1) sim = Math.max(simStr(a.replace(/ /g, ''), tgc), ...aw.map(x => simStr(x, tgc)));
    else sim = Math.max(simStr(a.replace(/ /g, ''), tgc), tw.filter(x => aw.includes(x)).length / tw.length * 0.95);
    if (sim > best.sim || !best.said) best = { sim, said: raw.trim() };
  });

}
const starsOf = sim => { const lo = S.settings.grade === 'low'; return sim >= (lo ? .75 : .85) ? 3 : sim >= (lo ? .45 : .55) ? 2 : 1; };

/* ---- 能力检测：只判断一次，判断出来后后面的词直接用对应的方式 ----

let REC = null, MR = null, MSTREAM = null, SP_TIMER = null, START_WATCH = null, STOP_WATCH = null, PLAYER = null;

const spMine = t => !!(SESS && view === 'session' && curTask() === t);

const NOTE_REC = '这台设备用不了自动打分（国内网络或直接打开文件时常见），已改成"录音对比"：录下来，和标准读音比一比。';
const NOTE_MIC = '麦克风打不开，先跟着喇叭大声读 2 遍吧。家长可以在浏览器里允许使用麦克风，再点"再试试话筒"。';
const NOTE_EMPTY = '没录到声音，靠近一点、大声一点，再录一次吧。';

function stopPlay() { if (PLAYER) { try { PLAYER.pause(); } catch (e) {} PLAYER = null; } }
function stopSpeech(abort) {
  clearTimeout(SP_TIMER); SP_TIMER = null; clearTimeout(START_WATCH); START_WATCH = null;
  if (abort) { clearTimeout(STOP_WATCH); STOP_WATCH = null; stopPlay(); }
  if (REC) {
    try { if (abort) { REC.onend = REC.onresult = REC.onerror = REC.onstart = REC.onaudiostart = null; REC.abort(); } else REC.stop(); } catch (e) {}
    if (abort) REC = null;

}
function cancelAuto(t) { if (t && t.sp) t.sp.auto = false; clearTimeout(CD_TIMER); if (SESS) SESS.tok = 0; }

async function startSpeech() {
  const t = SESS && curTask(); if (!t || t.type !== 'speak') return;
  const sp = t.sp;
  if (sp.state === 'listening') return;
  try { speechSynthesis.cancel(); } catch (e) {}
  cancelAuto(t); stopSpeech(true);
  if (sp.audio) { URL.revokeObjectURL(sp.audio); sp.audio = null; }
  if (sp.mode === 'sr' && SR_STATE === 'bad') sp.mode = pickSpMode();
  if (sp.mode === 'none') { sp.notice = NOTE_MIC; render(); return; }
  sp.session = (sp.session || 0) + 1;

  render();

/* ---- 录音 ---- */
async function startRec(t, my, live, side) {
  const sp = t.sp, w = W(t.id);
  if (!side) START_WATCH = setTimeout(() => { if (live() && !sp.started) recFail(t, 'timeout'); }, 15000);
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }); }
  catch (e) { if (!side && spMine(t) && sp.session === my) recFail(t, (e && e.name) || 'error'); return; }
  if (!(spMine(t) && sp.session === my && sp.state === 'listening')) { stream.getTracks().forEach(x => x.stop()); return; }
  let mr;
  try { mr = new window.MediaRecorder(stream); } catch (e) { stream.getTracks().forEach(x => x.stop()); if (!side) recFail(t, 'MediaRecorder'); return; }

  mr.onstop = () => {
    stream.getTracks().forEach(x => x.stop()); if (MSTREAM === stream) MSTREAM = null; if (MR === mr) MR = null;
    if (!(spMine(t) && sp.session === my)) return;
    if (chunks.length) sp.audio = URL.createObjectURL(new Blob(chunks, { type: mr.mimeType || 'audio/webm' }));
    if (side) { if (sp.state === 'result') render(); return; }
    clearTimeout(STOP_WATCH);
    if (sp.state === 'listening') recDone(t);
  };
  try { mr.start(); } catch (e) { stream.getTracks().forEach(x => x.stop()); if (!side) recFail(t, 'start'); return; }
  if (side) return;
  sp.started = true; clearTimeout(START_WATCH); render();
  SP_TIMER = setTimeout(() => { if (live()) App.spStop(); }, w.type === 'phrase' ? 6000 : 4000);   // 到时间自动停
}
function recDone(t) {
  const sp = t.sp; sp.tries++; sp.state = 'result';
  if (!sp.audio) { sp.notice = NOTE_EMPTY; render(); return; }
  if (sp.notice === NOTE_EMPTY) sp.notice = '';
  const p = prog(t.id); p.spoke = true; save();
  render();
  playCompare(t, true);      // 自动连着听一次：标准读音 → 我读的；听完开始 3 秒倒计时
}
function recFail(t, code) {
  const sp = t.sp; stopSpeech(true);
  REC_STATE = 'bad'; REC_ERR = code || 'error';
  Object.assign(sp, { mode: 'none', state: 'idle', notice: NOTE_MIC });
  if (spMine(t)) render();
}
function playMine(t, done) {
  stopPlay();
  let fired = false;
  const fin = () => { if (fired) return; fired = true; if (PLAYER === a) PLAYER = null; if (done) done(); };
  const a = new Audio(t.sp.audio); PLAYER = a;
  a.onended = fin; a.onerror = fin;
  try { const pr = a.play(); if (pr && pr.catch) pr.catch(fin); } catch (e) { fin(); }

}
function playCompare(t, auto) {

  sp.playing = 'std'; render();

    sp.playing = 'mine'; render();
    setTimeout(() => playMine(t, () => {
      if (!spMine(t) || sp.playing !== 'mine') return;
      sp.playing = '';
      if (auto) { sp.auto = true; startCountdown(() => spMine(t) && t.sp.state === 'result' && t.sp.auto, () => App.spNext(true)); }

/* ---- 自动打分（语音识别） ---- */
function startSR(t, my, live) {
  const sp = t.sp, w = W(t.id), alts = []; let err = '';
  const rec = new SR(); REC = rec;
  rec.lang = 'en-US'; rec.interimResults = true; rec.maxAlternatives = 5; rec.continuous = false;
  const began = () => { if (!sp.started) { sp.started = true; clearTimeout(START_WATCH); const el = document.getElementById('live'); if (el && !sp.interim) el.textContent = '正在听…'; } };
  rec.onstart = rec.onaudiostart = began;
  rec.onresult = e => {
    began();
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) for (let k = 0; k < r.length; k++) alts.push(r[k].transcript);
      else interim += r[0].transcript;
    }

  };
  rec.onerror = e => { err = (e && e.error) || 'error'; };
  rec.onend = () => {
    if (REC !== rec) return;
    REC = null; clearTimeout(SP_TIMER); clearTimeout(STOP_WATCH); clearTimeout(START_WATCH);
    if (MR && MR.state === 'recording') { try { MR.stop(); } catch (e) {} }
    if (!(spMine(t) && sp.session === my)) return;
    if (err && err !== 'no-speech' && err !== 'aborted') { srToRec(t, err); return; }
    if (!alts.length && sp.interim) alts.push(sp.interim);
    if (!sp.started && !alts.length && !err) { srToRec(t, 'no-audio'); return; }   // 一开始就结束了，引擎没在工作
    markSrOk();
    sp.tries++;
    if (!alts.length) { Object.assign(sp, { state: 'result', stars: 0, heard: '' }); render(); return; }
    const r = scoreSpeech(alts, w.en), st = starsOf(r.sim);
    Object.assign(sp, { state: 'result', stars: st, heard: r.said });
    if (st > sp.best) sp.best = st;
    const p = prog(t.id); p.speak = Math.max(p.speak || 0, st); p.spoke = true; save();
    if (st >= 2) sfx.ok();
    if (st === 3) { sp.auto = true; startCountdown(() => spMine(t) && t.sp.state === 'result' && t.sp.auto, () => App.spNext(false)); }
    render();
  };
  // 刚停下发音就开始识别，安卓上偶尔会失败，稍等一下
  setTimeout(() => {
    if (REC !== rec || !live()) return;
    try { rec.start(); } catch (e) { err = 'start-failed'; rec.onend(); }
  }, 150);

  START_WATCH = setTimeout(() => { if (live() && !sp.started) srToRec(t, 'no-response'); }, SR_STATE === 'ok' ? 5000 : 3000);
  // 最长听 8 秒

}
function armStopWatch(t) {
  clearTimeout(STOP_WATCH);

}
// 自动打分用不了 → 改成录音对比。孩子正在读（还没点"我读完了"）时直接开始录音
function srToRec(t, code) {
  const sp = t.sp, autoStart = sp.state === 'listening' && !sp.stopReq;

/* ========== 听写 ==========
   每个任务单独听写：任务里的词都学完后，任务卡片会提示"去听写"；也可以随时点"📝 听写"自己开始。
   三种方式：听音写词 / 看中文写词 / 写在纸上（家长对答案）。听写时不给提示、不当场判对错，全部写完再出成绩和奖励。 */
const DMODE = {
  audio: { name: '🔊 听音写词', desc: '听读音，用键盘写出单词。可以多听几遍，没有图片和字母提示，和学校听写一样。' },
  zh: { name: '🀄 看中文写词', desc: '看中文意思，用键盘写出英文。不读音，更难一些。' },
  paper: { name: '📄 写在纸上', desc: '应用一个一个读，孩子写在本子上；全部读完后，家长对答案，点出写错的词，再提交成绩。' }
};
const DREWARD = { done: 5, per: 1, good: 10, perfect: 20, record: 5, minBonus: 5, fullPerDay: 2, randN: 20 };
let DICT = null, DSEL = null;
const dictKey = tid => 'dict:' + tid;
const dictToday = tid => (S.dictLog || []).filter(x => x.tid === tid && x.date === today()).length;
const lastDict = tid => [...(S.dictLog || [])].reverse().find(x => x.tid === tid);
const dictBest = tid => (S.dictBest || {})[tid];
const pctOf = (c, n) => n ? Math.round(c / n * 100) : 0;
function dictScopes(t) {
  const all = keysOf(t), learned = t.words.filter(w => pOf(t, w).box >= 1).map(w => keyOf(t.id, w.id));
  const wrong = t.words.filter(w => pOf(t, w).inWrong).map(w => keyOf(t.id, w.id));
  const ld = lastDict(t.id), last = ld ? ld.wrong.map(x => keyOf(t.id, x.id)).filter(k => t.words.some(w => keyOf(t.id, w.id) === k)) : [];
  const base = learned.length && learned.length < all.length ? learned : all;
  const out = [];
  out.push({ id: 'all', name: `全部 ${all.length} 个`, keys: all });
  if (learned.length && learned.length < all.length) out.push({ id: 'learned', name: `已学的 ${learned.length} 个`, keys: learned });
  if (base.length > DREWARD.randN) out.push({ id: 'rand', name: `随机 ${DREWARD.randN} 个`, keys: base, rand: true });
  if (wrong.length) out.push({ id: 'wrong', name: `错词本里的 ${wrong.length} 个`, keys: wrong });
  if (last.length) out.push({ id: 'last', name: `上次写错的 ${last.length} 个`, keys: last });
  return out;
}
const DSCOPE_NAME = { all: '全部', learned: '已学的词', rand: '随机', wrong: '错词本', last: '上次写错的' };
const allLearned = t => t.words.length > 0 && !unlearned(t).length;
// 任务的词都学完了，但还没有听写过 → 默认该听写了
const dictDue = t => allLearned(t) && !dictBest(t.id);

function vDictStart() {
  const t = TK(DSEL.tid); if (!t) return '';
  const sc = dictScopes(t), cur = sc.find(x => x.id === DSEL.scope) || sc[0], cnt = cur.rand ? Math.min(DREWARD.randN, cur.keys.length) : cur.keys.length;
  const b = dictBest(t.id), left = unlearned(t).length, used = dictToday(t.id);
  return `<div class="sess-top"><button class="x" onclick="App.home()">←</button><h2 style="margin:0">📝 听写 · ${t.icon} ${esc(t.name)}</h2></div>
  <div class="card">
    ${allLearned(t) ? `<div class="all-done" style="background:var(--purple-bg)">🎉 这个任务的 ${t.words.length} 个词都学完啦，来检验一下吧！</div>`
      : `<div class="notice">还有 ${left} 个词没学。现在也可以先听写${sc.some(x => x.id === 'learned') ? '已经学过的词' : '，没学过的词写不出来也没关系'}；全部学完后再来一次完整的听写。</div>`}
    <div class="muted small">${b ? `最好成绩：${b.c} / ${b.n}（${pctOf(b.c, b.n)}%，${b.date}）` : '还没有听写过'}${used ? ` · 今天已经听写 ${used} 次` : ''}</div>
    <label class="f">听写方式</label>
    <div class="seg">${Object.entries(DMODE).map(([k, m]) => `<button class="${DSEL.mode === k ? 'on' : ''}" onclick="App.dictMode('${k}')">${m.name}</button>`).join('')}</div>
    <div class="muted small" style="margin-top:6px">${DMODE[DSEL.mode].desc}</div>
    <label class="f">听写范围</label>

// 判分：大小写不算错，但要提醒；多余的空格不算错
function dictJudge(w, ans) {
  const a = String(ans || '').trim().replace(/\s+/g, ' ');
  const ok = !!a && norm(a) === norm(w.en);
  const caseWarn = ok && /[A-Z]/.test(w.en) && a !== w.en.replace(/\s+/g, ' ');
  return { ok, caseWarn };
}

function dictFinish(results) {
  const t = TK(DICT.tid), n = results.length, c = results.filter(r => r.ok).length;
  const used = dictToday(DICT.tid), capped = used >= DREWARD.fullPerDay, pct = pctOf(c, n);
  const best = dictBest(DICT.tid), bestPct = best ? pctOf(best.c, best.n) : -1;
  const record = !!best && n >= DREWARD.minBonus && pct > bestPct;
  const items = [['完成听写', DREWARD.done]];
  if (!capped) {
    if (c) items.push([`写对 ${c} 个`, c * DREWARD.per]);
    if (n >= DREWARD.minBonus && pct === 100) items.push(['全部写对', DREWARD.perfect]);
    else if (n >= DREWARD.minBonus && pct >= 90) items.push(['正确率 90% 以上', DREWARD.good]);
    if (record) items.push(['打破最好成绩', DREWARD.record]);
  }
  const stars = items.reduce((s, x) => s + x[1], 0), before = S.stars;
  addStars(stars);
  // 写错的词：放进错词本；学过的词退回盒子 1，明天复习
  const wrong = [];
  results.forEach(r => {
    if (r.ok) return;
    const p = prog(r.k); p.inWrong = true; p.wrong = (p.wrong || 0) + 1;
    if (p.box >= 1) { p.box = 1; p.due = addDays(today(), 1); }
    wrong.push({ id: splitKey(r.k)[1], ans: r.ans || '', paper: !!r.paper });
  });
  // 听写时没有任何提示还写对了 → 从错词本移出
  results.filter(r => r.ok).forEach(r => { const p = prog(r.k); p.right = (p.right || 0) + 1; p.inWrong = false; });
  if (!best || pct > bestPct || (pct === bestPct && n > best.n)) S.dictBest[DICT.tid] = { c, n, date: today() };
  S.dictLog.push({ tid: DICT.tid, tname: t ? t.name : '', date: today(), mode: DICT.mode, scope: DICT.scope, n, c, stars, capped, wrong: wrong.map(x => ({ id: x.id, ans: x.ans })) });
  if (S.dictLog.length > 60) S.dictLog = S.dictLog.slice(-60);
  if (S.resume) delete S.resume[dictKey(DICT.tid)];
  S.dictBest = S.dictBest || {}; S.dictLog = S.dictLog || [];
  const g0 = nextGoal(before), g1 = nextGoal();
  DRES = { tid: DICT.tid, n, c, stars, items, capped, used: used + 1, record, wrong, caseNote: results.filter(r => r.caseWarn).map(r => splitKey(r.k)[1]),
    newAv: !!(g0 && !g0.ok && g1 && g1.ok) };
  save(); DICT = null; view = 'dictres'; sfx.done(); render();
  if (pct >= 90) confetti();
}
function dictPersist() { if (!DICT) return; S.resume = S.resume || {}; S.resume[dictKey(DICT.tid)] = JSON.parse(JSON.stringify(DICT)); save(); }
function dictLoad(tid) {
  const r = (S.resume || {})[dictKey(tid)], t = TK(tid);
  if (!r || !t || !Array.isArray(r.list)) return false;
  const valid = k => t.words.some(w => keyOf(tid, w.id) === k);
  const keep = r.list.map((k, i) => valid(k) ? i : -1).filter(i => i >= 0);
  if (!keep.length) { delete S.resume[dictKey(tid)]; save(); return false; }
  const D = { tid, mode: DMODE[r.mode] ? r.mode : 'audio', scope: r.scope || 'all', list: keep.map(i => r.list[i]), ans: keep.map(i => (r.ans || [])[i]),
    marks: Array.isArray(r.marks) ? keep.map(i => !!r.marks[i]) : null, stage: r.stage === 'check' ? 'check' : 'write', cur: r.cur || '', spokenI: -1 };
  D.i = Math.min(Math.max(0, keep.filter(i => i < (Number(r.i) || 0)).length), D.list.length - 1);
  if (D.mode !== 'paper' && D.ans.filter(a => a != null).length >= D.list.length) D.i = D.list.length;   // 全写完了
  DICT = D; return true;
}

function planText(n, npd, dl) {
  if (!n) return '这个任务里的词都学过了。';
  if (!npd) {
    const g = grpSize(), days = Math.ceil(n / g);
    let s = `还有 ${n} 个没学，每天不限，一组 ${g} 个。每天学一组大约 ${days} 天学完，多学几组会更快`;
    if (dl) {
      const left = diffDays(today(), dl) + 1;
      if (left <= 0) s += '。⚠️ 截止日期已经过了';
      else if (days > left) s += `。⚠️ 离截止只剩 ${left} 天，每天要学大约 ${Math.ceil(n / left)} 个（${Math.ceil(n / left / g)} 组）`;
      else s += '，每天一组截止前就能学完 ✅';
    }
    return s + '。';
  }
  const days = Math.ceil(n / npd);
  let s = `还有 ${n} 个没学，每天 ${npd} 个，大约 ${days} 天学完新词`;
  if (dl) {
    const left = diffDays(today(), dl) + 1;
    if (left <= 0) s += '。⚠️ 截止日期已经过了';
    else if (days > left) s += `。⚠️ 离截止只剩 ${left} 天，来不及，建议每天学 ${Math.ceil(n / left)} 个`;
    else s += '，截止前能学完 ✅';
  }
  return s + '。';
}

      </div></div>`;
  };
  return `<div class="card">
    <div class="between"><h3 style="margin:0">我布置的任务</h3><button class="btn sm green" onclick="App.edit('new')">＋ 新建任务</button></div>

    ${cur.length ? cur.map(row).join('') : '<div class="muted center" style="padding:20px">还没有任务，点"新建任务"开始布置</div>'}
    ${total > g.maxNew
      ? `<div class="notice">⚠️ 进行中的任务每天${anyUnl ? '至少' : '加起来'}要学 ${total} 个新词（必做 ${req} 个），超过了${g.label}建议的 ${g.maxNew} 个。孩子容易累，可以给任务设一个每天的数量，或者先暂停一个任务。${anyUnl ? `<br>"每天不限"的任务按一组 ${g.group} 个算：每天学完一组就算完成，想多学可以接着学下一组。` : ''}</div>`
      : act.length ? `<div class="muted small" style="margin-top:10px">每天${anyUnl ? '至少' : '一共'}安排 ${total} 个新词（必做 ${req} 个），${g.label}建议不超过 ${g.maxNew} 个。${anyUnl ? `"每天不限"的任务按一组 ${g.group} 个算，学完一组可以接着学。` : ''}</div>` : ''}
  </div>
  ${arc.length ? `<div class="card"><h3>🗂️ 已归档（${arc.length}）</h3><div class="muted small" style="margin-bottom:6px">不再出新词，已学的词仍会按时复习。</div>${arc.map(row).join('')}</div>` : ''}`;
}

    <div class="muted small" style="margin-top:6px">格式：<code>英文 中文</code>，末尾可以加一个 emoji 当图片，比如 <code>play football 踢足球 ⚽</code>。常见词会自动配图；可以直接从 Excel 复制两列粘贴进来。<br>

    <div id="e_plan" class="muted small" style="margin-top:8px">${t ? planText(n0, npd, t.deadline) : '填好单词后，这里会显示大约几天能学完。'}</div>

function vParent() {
  const tabs = [['tasks', '📝 任务'], ['share', '📲 分享与导入'], ['report', '📊 报告'], ['set', '⚙️ 设置与备份']];
  let body = '';

    if (PEDIT && PEDIT !== 'new' && !TK(PEDIT)) PEDIT = null;

    </div>
    <div class="card"><h3>导入别人发来的词表</h3>
      <div class="muted small">在微信里长按家长或老师发来的整段文字 → 复制，再回到这里粘贴。只粘贴了一部分也没关系，应用会自动找出分享码；但分享码本身要完整。</div>
      <label class="f">粘贴分享码</label>
      <textarea id="p_code" class="t" rows="3" placeholder="把家长或老师发来的整段文字粘贴到这里"></textarea>
      <div class="btns" style="justify-content:flex-start">${clip ? '<button class="btn ghost sm" onclick="App.pasteClip()">📋 从剪贴板粘贴</button>' : ''}<button class="btn sm" onclick="App.importText()">识别并导入</button></div>
    </div>`;
  } else if (PTAB === 'report') {
    const all = S.tasks, sum = f => all.reduce((s, t) => s + f(t), 0);
    const tot = sum(t => t.words.length), learned = sum(t => t.words.length - unlearned(t).length), mst = sum(mastered);
    const wrongOf = t => t.words.filter(w => pOf(t, w).inWrong).length;

    const st = p => p.box === 0 ? '<span class="badge new">未学</span>' : p.box === 6 ? '<span class="badge done">已掌握</span>' : `<span class="badge box">盒子 ${p.box}</span>`;
    const rel = d => { if (!d) return '—'; const n = diffDays(today(), d); return n <= 0 ? '今天' : n === 1 ? '明天' : n + ' 天后'; };
    const top = rt ? rt.words.filter(w => pOf(rt, w).wrong > 0).sort((a, b) => pOf(rt, b).wrong - pOf(rt, a).wrong).slice(0, 5) : [];
    body = `<div class="card">
      <div class="stats">
        <div class="stat"><b>${learned}/${tot}</b><span>已学（全部任务）</span></div>

    <div class="card"><h3>各任务进度</h3>
      <div class="tw"><table><tr><th>任务</th><th>词数</th><th>已学</th><th>掌握率</th><th>错词</th><th>听写最好</th><th>截止</th></tr>
      ${all.map(t => { const b = dictBest(t.id); return `<tr><td>${t.icon} ${esc(t.name)}${t.status !== 'active' ? ` <span class="badge new">${STATUS[t.status]}</span>` : ''}</td><td>${t.words.length}</td><td>${t.words.length - unlearned(t).length}</td><td>${t.words.length ? Math.round(mastered(t) / t.words.length * 100) : 0}%</td><td>${wrongOf(t)}</td><td>${b ? `${b.c}/${b.n}（${pctOf(b.c, b.n)}%）` : dictDue(t) ? '<span class="badge warn">待听写</span>' : '—'}</td><td>${t.deadline ? dlText(t.deadline) : '—'}</td></tr>`; }).join('')}</table></div></div>

      <div class="muted small" style="margin-top:6px">括号里是孩子写的拼法，可以看出错在哪里。写错的词会自动放进错词本，并安排第二天复习。</div>`

    ${rt ? `<div class="card"><h3>单词明细</h3>
      <div class="seg" style="margin-bottom:12px">${all.map(t => `<button class="${t === rt ? 'on' : ''}" onclick="App.rsel('${t.id}')">${t.icon} ${esc(t.name)}</button>`).join('')}</div>
      ${top.length ? `<div style="margin-bottom:10px"><b>⚠️ 最常错：</b>${top.map(w => `<span class="wchip" style="display:inline-block;margin:4px">${w.emo} ${esc(w.en)} ×${pOf(rt, w).wrong}</span>`).join('')}</div>` : ''}
      <div class="tw"><table><tr><th>英文</th><th>中文</th><th>状态</th><th>下次复习</th><th>对/错</th><th>跟读</th></tr>

  } else {

      <div class="seg av avsel">${ALL_AV.filter(a => S.avatars.includes(a.e)).map(a => `<button class="${S.settings.avatar === a.e ? 'on' : ''}" onclick="App.setAv(${ALL_AV.indexOf(a)},this)" title="${esc(a.n)}">${avBox(a.e, 44, 'still')}</button>`).join('')}</div>
      <label class="f">孩子的年级（决定题型和每天建议的新词量）</label>
      <div class="seg">${Object.entries(GRADE).map(([k, g]) => `<button class="${S.settings.grade === k ? 'on' : ''}" onclick="App.setGrade('${k}',this)">${g.label}</button>`).join('')}</div>
      <div class="muted small" style="margin-top:6px">低年级：听音选图 + 看图选词 + 字母块；中年级：再加键盘拼写；高年级：以键盘拼写为主。</div>
      <label class="f">📝 句子填空</label>
      <div class="seg"><button class="${S.settings.sentOn !== false ? 'on' : ''}" onclick="App.setSent(true,this)">开启</button><button class="${S.settings.sentOn === false ? 'on' : ''}" onclick="App.setSent(false,this)">关闭</button></div>
      <div class="muted small" style="margin-top:6px">开启后，学新词时在"看图选词"之后，用例句挖空选词，练习这个词在句子里怎么用。只有写了例句的词才会出这道题；内置的两个任务每个词都有例句。</div>
      <label class="f">⌨️ 拼写键盘</label>
      <div class="seg">${[['auto', '自动'], ['builtin', '内置字母键盘'], ['system', '系统键盘']].map(([k, l]) => `<button class="${(S.settings.kb || 'auto') === k ? 'on' : ''}" onclick="App.setKb('${k}',this)">${l}</button>`).join('')}</div>
      <div class="muted small" style="margin-top:6px">自动：平板和手机用内置字母键盘，电脑用实体键盘。内置键盘不会弹出中文输入法，也没有联想补全，孩子必须自己拼。</div>

      ${R ? `<div class="notice">即将恢复：${rInfo} · ⭐ ${Number(R.stars) || 0} · 备份于 ${esc(String(RESTORE.at || '').slice(0, 10))}<br><b>这台平板上现在的进度会被覆盖。</b>旧版本的备份会自动变成一个任务。</div>

        <button class="btn sm" onclick="App.voiceTest()">🔊 读一句 "Good morning" 试试</button>
        ${!TTS.why() && (S.settings.ttsDl || TTS.st === 'ready') ? `<button class="btn ghost sm" onclick="App.ttsDel(this)">${ttsArm ? '再点一次确认删除' : '🗑️ 删除标准发音'}</button>` : ''}
      </div>

        : v ? `✅ 使用的英文语音：${esc(v.name)}${v.localService === false ? '（联网语音，断网或国内网络下可能没声音）' : '（本机语音，断网也能用）'}`
        : '⚠️ 没找到英文语音。安卓上请到 系统设置 → 文字转语音（TTS）输出，把首选引擎设为 Google 语音服务，并下载"英语（美国）"语音包。'; })()}</div></div>
    <div class="card"><h3>🖼️ 图片样式</h3>
      <div class="seg"><button class="${S.settings.icons !== 'sys' ? 'on' : ''}" onclick="App.setIcons('fluent')">统一图标</button><button class="${S.settings.icons === 'sys' ? 'on' : ''}" onclick="App.setIcons('sys')">设备自带表情</button></div>
      <div class="muted small" style="margin-top:6px">统一图标：每台设备上的单词图片都一样，旧平板上也不会显示成方块。图标来自微软 Fluent Emoji（MIT 开源授权）。</div></div>
    <div class="card"><h3>🗑️ 重置</h3>
      <div class="muted small">清空所有任务的学习进度、星星、兑换的头像、错词本和听写记录，任务和词表会保留。</div>
      <div style="margin-top:12px"><button class="btn orange" onclick="App.reset()">${resetArm ? '再点一次确认重置' : '重置学习进度'}</button></div></div>
    <div class="card"><h3>🔐 隐私</h3><div class="muted small">学习数据只保存在这台设备的浏览器里，没有广告和外部链接。分享码里只有任务名称、词表和设置，不含孩子的昵称和学习记录。<br>应用不使用麦克风和摄像头，学习时完全不需要联网。</div></div>`;
  }
  return `<div class="sess-top"><button class="x" onclick="App.home()">←</button><h2 style="margin:0">家长 / 老师</h2></div>
    <div class="tabs">${tabs.map(([k, l]) => `<button class="${PTAB === k ? 'on' : ''}" onclick="App.ptab('${k}')">${l}</button>`).join('')}</div>${body}`;
}

let LAST_KEY = '';
function render() {
  const el = document.getElementById('view');
  const key = [view, SESS ? SESS.i : '', PTAB, PEDIT || '', DICT ? DICT.i + DICT.stage : ''].join('/');
  const moved = key !== LAST_KEY; LAST_KEY = key;
  el.innerHTML = view === 'home' ? vHome() : view === 'session' ? vSession() : view === 'done' ? vDone()
    : view === 'wrong' ? vWrong() : view === 'shop' ? vShop() : view === 'dictstart' && DSEL ? vDictStart() : view === 'dict' && DICT ? (DICT.stage === 'check' ? vDictCheck() : vDict())
    : view === 'dictres' && DRES ? vDictResult() : view === 'gate' ? vGate() : view === 'import' && PENDING ? vImport() : vParent();
  if (view === 'session') {
    const t = curTask();
    if (!SESS.fb && t.type !== 'pick' && t.type !== 'sent' && !t.spoken) { t.spoken = true; setTimeout(() => speak(W(t.id).en), 300); }
    const ti = document.getElementById('ti'); if (ti && !SESS.fb) { try { ti.focus({ preventScroll: true }); ti.setSelectionRange(ti.value.length, ti.value.length); } catch (e) {} }
    if (SESS.fb) { const fb = document.querySelector('.fb'); if (fb && fb.scrollIntoView) setTimeout(() => { try { fb.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) {} }, 30); }
  }
  if (view === 'dict' && DICT && DICT.stage === 'write') {
    if (DICT.mode !== 'zh' && DICT.spokenI !== DICT.i) { DICT.spokenI = DICT.i; const D = DICT, i = DICT.i, k = DICT.list[i]; setTimeout(() => { if (view === 'dict' && DICT === D && D.i === i && D.stage === 'write') speak(W(k).en); }, 350); }
    const ti = document.getElementById('ti'); if (ti) { try { ti.focus({ preventScroll: true }); ti.setSelectionRange(ti.value.length, ti.value.length); } catch (e) {} }
  }
  if (moved) { try { window.scrollTo(0, 0); } catch (e) {} }
  if (view === 'gate') { const gi = document.getElementById('gi'); if (gi) gi.focus(); }
  attachScan();
  if (view !== 'home') navPush();
}

/* ---- 安卓返回键：不直接退出应用，而是回到上一层 ---- */
let NAV = false;
function navPush() { if (NAV) return; try { history.pushState({ wh: 1 }, ''); NAV = true; } catch (e) {} }
window.addEventListener('pagehide', () => { if (SESS && view === 'session') persistSess(!!SESS.fb); if (DICT && view === 'dict') dictPersist(); });
window.addEventListener('popstate', () => {
  NAV = false;
  if (view === 'home') return;            // 首页再按一次返回才退出
  if (view === 'parent' && PEDIT) { PEDIT = null; render(); return; }
  if (view === 'import') { App.cancelImport(); return; }
  App.home();
});
// 切到后台时关掉摄像头和麦克风
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'hidden') return;
  if (SESS && view === 'session') persistSess(!!SESS.fb);
  if (DICT && view === 'dict') dictPersist();
  const had = !!SCAN; stopScan(); stopSpeech(true);
  if (SESS && view === 'session') { const t = curTask(); if (t && t.sp && t.sp.state === 'listening') t.sp.state = 'idle'; render(); }
  else if (had) render();
});
// 内置键盘模式下，实体键盘也能输入
document.addEventListener('keydown', e => {
  if (view === 'dict' && DICT && DICT.stage === 'write' && DICT.mode !== 'paper' && useKb() && !e.ctrlKey && !e.metaKey && !e.altKey) {
    if (e.key === 'Enter') { e.preventDefault(); App.dictSubmit(); }
    else if (e.key === 'Backspace') { e.preventDefault(); App.bs(); }
    else if (/^[a-zA-Z' \-]$/.test(e.key)) { e.preventDefault(); App.key(e.key.toLowerCase()); }
    return;
  }
  if (view !== 'session' || !SESS || SESS.fb || !useKb()) return;
  const t = curTask(); if (!t || t.type !== 'type' || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Enter') { e.preventDefault(); App.submit(); }
  else if (e.key === 'Backspace') { e.preventDefault(); App.bs(); }
  else if (/^[a-zA-Z' \-]$/.test(e.key)) { e.preventDefault(); App.key(e.key.toLowerCase()); }
});

/* ========== 交互 ========== */
const segOn = el => el.parentNode.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el));
const App = {
  start, next,
  home() {
    const was = !!(SESS && view === 'session');
    if (was) persistSess(!!SESS.fb);
    const wasDict = !!(DICT && view === 'dict');
    if (wasDict) dictPersist();
    stopSpeech(true); stopScan(); clearTimeout(CD_TIMER); view = 'home'; SESS = null; DICT = null; DSEL = null; DRES = null; resetArm = false; PEDIT = null; render();
    if (was) toast('进度已保存，下次点"继续学"接着学');
    if (wasDict) toast('听写进度已保存，下次点"继续听写"接着写');
  },
  go(v) { view = v; render(); },
  say() { const t = SESS && curTask(); if (!t) return; speak(t.type === 'sent' && !SESS.fb ? W(t.id).en : sayText(t)); },
  sayIdx(i) { const k = wrongList()[i]; if (k) speak(W(k).en); },
  pick(i) { const t = curTask(); if (SESS.fb) return; t.chosen = i; answer(t.options[i] === t.id); },
  tile(pi) {
    const t = curTask(); if (SESS.fb || t.ans.includes(pi)) return;
    t.ans.push(pi);
    if (t.ans.length === t.pool.length) {
      const w = W(t.id), s = t.ans.map(i => t.pool[i]).join(w.type === 'phrase' ? ' ' : '');
      if (norm(s) !== norm(w.en)) { t.ans = []; answer(false, s); } else answer(true);
    } else render();
  },
  untile(k) { const t = curTask(); if (SESS.fb) return; t.ans.splice(k, 1); render(); },
  tv(v) { curTask().val = v; },
  key(c) {
    if (view === 'dict' && DICT) { DICT.cur = ((DICT.cur || '') + c).slice(0, 40); const el = document.getElementById('tvw'); if (el) el.innerHTML = kbDisp(DICT.cur, false); return; }
    const t = SESS && curTask(); if (!t || t.type !== 'type' || SESS.fb) return;
    t.val = ((t.val || '') + c).slice(0, 40);
    const el = document.getElementById('tvw'); if (el) el.innerHTML = kbDisp(t.val, false);
  },
  bs() {
    if (view === 'dict' && DICT) { DICT.cur = (DICT.cur || '').slice(0, -1); const el = document.getElementById('tvw'); if (el) el.innerHTML = kbDisp(DICT.cur, false); return; }
    const t = SESS && curTask(); if (!t || t.type !== 'type' || SESS.fb) return;
    t.val = (t.val || '').slice(0, -1);
    const el = document.getElementById('tvw'); if (el) el.innerHTML = kbDisp(t.val, false);
  },
  voiceTest() { loadVoices(); speak('Good morning'); setTimeout(() => { if (view === 'parent' && PTAB === 'set') render(); }, 600); },
  setTts(v) { S.settings.tts = v; save(); if (v === 'sys') { TTS.stop(); TTS.kill(); TTS.st = 'off'; } else { LS.del('wh_tts_loading'); TTS.boot(); } render(); },
  setAccent(v) { S.settings.accent = v; save(); TTS.stop(); render(); speak('Good morning'); if (TTS.usable()) setTimeout(() => TTS.warm(), 1500); },
  ttsGet() { LS.del('wh_tts_loading'); TTS.kill(); TTS.st = 'off'; TTS.start(true); },
  ttsDel(el) { if (!ttsArm) { ttsArm = true; render(); setTimeout(() => { if (ttsArm) { ttsArm = false; render(); } }, 4000); return; } ttsArm = false; TTS.remove().then(() => { toast('已删除标准发音'); render(); }); },
  picScan() {
    const ta = document.getElementById('e_raw'); if (!ta) return;
    if (!ta.value.trim()) { toast('先在词表里填好单词'); return; }
    PIC = picScanText(ta.value); PIC.text = ta.value;
    const el = document.getElementById('e_pic'); if (el) el.innerHTML = picPanel();
  },
  picSel(i, j) { if (!PIC || !PIC.rows[i]) return; PIC.rows[i].sel = j; const el = document.getElementById('e_pic'); if (el) el.innerHTML = picPanel(); },
  picClose() { PIC = null; const el = document.getElementById('e_pic'); if (el) el.innerHTML = ''; },
  picApply() {
    const ta = document.getElementById('e_raw'); if (!ta || !PIC) return;
    if (ta.value !== PIC.text) { App.picScan(); toast('词表刚改过，已经重新找了一遍，请再看一下'); return; }
    const r = picApplyText(ta.value, PIC.rows);
    ta.value = r.text; App.picClose(); App.edPlan();
    toast(`已给 ${r.n} 个词配好图，记得点"保存"`);
  },
  setIcons(v) { S.settings.icons = v; save(); LAST_KEY = ''; render(); },
  setSent(v, el) { S.settings.sentOn = v; save(); segOn(el); },
  setKb(v, el) { S.settings.kb = v; save(); segOn(el); },
  hint() {
    const t = curTask(), w = W(t.id); if (SESS.fb) return;
    const cur = t.val || ''; let k = 0;
    while (k < cur.length && k < w.en.length && cur[k].toLowerCase() === w.en[k].toLowerCase()) k++;
    t.val = w.en.slice(0, Math.min(w.en.length, k + 1)); t.hinted = true; render();
  },
  submit() {
    const t = curTask(), w = W(t.id); if (SESS.fb) return;
    const ti = useKb() ? null : document.getElementById('ti'), v = (ti && ti.value != null ? ti.value : t.val) || '';
    if (!v.trim()) { toast('先写一写哦 ✏️'); return; }
    t.val = v; const ok = norm(v) === norm(w.en); answer(ok, ok ? '' : v);
  },

  /* ---- 家长入口 ---- */
  gate(then) { stopSpeech(true); stopScan(); GATE = { a: 13 + Math.floor(Math.random() * 17), b: 6 + Math.floor(Math.random() * 4), then: then || '' }; view = 'gate'; render(); },
  gateCheck() {
    const v = Number((document.getElementById('gi') || {}).value);
    if (v !== GATE.a * GATE.b) { toast('答案不对哦，请家长来操作'); return; }
    if (GATE.then === 'import' && PENDING) view = 'import'; else { view = 'parent'; PTAB = 'tasks'; PEDIT = null; }
    render();
  },
  ptab(k) {
    stopScan(); PTAB = k; PEDIT = null; resetArm = false; RESTORE = null; render();
    if (k === 'share') { const t = shareTask(); if (t && (!SHARE || SHARE.key !== shareKey(t))) buildShare(); }
  },

  /* ---- 任务管理 ---- */
  edit(tid) {
    delArm = false; PIC = null;
    if (tid === 'new') {
      const used = new Set(S.tasks.map(t => t.icon));
      EDIT = { icon: ICONS.find(i => !used.has(i)) || ICONS[0], required: !S.tasks.some(t => t.required), status: 'active' };
    } else if (tid) { const t = TK(tid); if (!t) return; EDIT = { icon: t.icon, required: t.required, status: t.status }; }
    PEDIT = tid || null; render();
    try { window.scrollTo(0, 0); } catch (e) {}
  },
  edIcon(ic, el) { EDIT.icon = ic; segOn(el); },
  edReq(v, el) { EDIT.required = v; segOn(el); },
  edStatus(s, el) { EDIT.status = s; segOn(el); },
  edPlan() {
    const t = PEDIT && PEDIT !== 'new' ? TK(PEDIT) : null;
    const unl = !!(document.getElementById('e_unl') || {}).checked, sl = document.getElementById('e_npd');
    const raw = (document.getElementById('e_raw') || {}).value || '', npd = unl ? 0 : (Number((sl || {}).value) || 5);
    const dl = (document.getElementById('e_dl') || {}).value || '';
    if (sl) { sl.disabled = unl; if (sl.style) sl.style.opacity = unl ? '.35' : ''; }
    const nv = document.getElementById('e_npdv'); if (nv) nv.textContent = unl ? '不限' : npd + ' 个';
    const ws = parseList(raw), n = ws.filter(w => !(t && (t.progress[w.id] || EMPTY_P).box)).length;
    const el = document.getElementById('e_plan'); if (el) el.innerHTML = ws.length ? planText(n, npd, dl) : '填好单词后，这里会显示大约几天能学完。';
    const ee = document.getElementById('e_ex'); if (ee) ee.innerHTML = exInfo(ws);
  },
  edClearDl() { const el = document.getElementById('e_dl'); if (el) el.value = ''; App.edPlan(); },
  saveTask() {
    const name = ((document.getElementById('e_name') || {}).value || '').trim();
    if (!name) { toast('请给任务起个名字'); return; }
    const raw = (document.getElementById('e_raw') || {}).value || '', ws = parseList(raw);
    if (!ws.length) { toast('没有识别到单词，请检查格式'); return; }
    const npd = (document.getElementById('e_unl') || {}).checked ? 0 : (Number((document.getElementById('e_npd') || {}).value) || 5), dl = (document.getElementById('e_dl') || {}).value || '';
    let msg;
    if (PEDIT === 'new') {
      const t = newTask({ name, icon: EDIT.icon, required: EDIT.required, rawList: raw, words: ws, newPerDay: npd, deadline: dl });
      S.tasks.push(t); msg = `已创建任务「${t.name}」，共 ${ws.length} 个`;
    } else {
      const t = TK(PEDIT); if (!t) return;
      Object.assign(t, { name: name.slice(0, 20), icon: EDIT.icon, required: EDIT.required, rawList: raw, words: ws,
        newPerDay: npd === 0 ? 0 : Math.min(12, Math.max(1, npd)), deadline: /^\d{4}-\d{2}-\d{2}$/.test(dl) ? dl : '', status: EDIT.status });
      msg = `已保存「${t.name}」`;
    }
    save(); PEDIT = null; render(); toast(msg);
  },
  delTask(el) {
    if (!delArm) { delArm = true; el.textContent = '再点一次确认删除'; return; }
    const t = TK(PEDIT); delArm = false; if (!t) return;
    S.tasks = S.tasks.filter(x => x.id !== t.id); if (S.resume) { delete S.resume['task:' + t.id]; delete S.resume['review:' + t.id]; delete S.resume[dictKey(t.id)]; } delete S.dictBest[t.id]; save(); PEDIT = null; render(); toast(`已删除「${t.name}」`);
  },
  tmove(tid, d) {
    const t = TK(tid); if (!t) return;
    const grp = S.tasks.filter(x => (x.status === 'archived') === (t.status === 'archived'));
    const o = grp[grp.indexOf(t) + d]; if (!o) return;
    const a = S.tasks.indexOf(t), b = S.tasks.indexOf(o); S.tasks[a] = o; S.tasks[b] = t; save(); render();
  },

  /* ---- 孩子信息 ---- */
  setGrade(k, el) { S.settings.grade = k; save(); segOn(el); },
  setAv(i, el) { const a = ALL_AV[i]; if (!a || !S.avatars.includes(a.e)) return; S.settings.avatar = a.e; save(); segOn(el); },
  shop() { stopSpeech(true); SHOPSEL = null; view = 'shop'; render(); },

  /* ---- 听写 ---- */
  dict(tid) {
    const t = TK(tid); if (!t) return;

    if (dictLoad(tid)) {
      view = 'dict'; toast('接着上次的听写继续 💪');
      if (DICT.i >= DICT.list.length) { App.dictEnd(); return; }
      render(); return;
    }
    const sc = dictScopes(t);
    DSEL = { tid, mode: (DSEL && DSEL.tid === tid && DSEL.mode) || S.settings.dictMode || 'audio', scope: sc.some(x => x.id === 'learned') ? 'learned' : 'all' };
    view = 'dictstart'; render();
  },
  dictMode(m) { if (!DMODE[m]) return; DSEL.mode = m; S.settings.dictMode = m; save(); render(); },
  dictScope(s) { DSEL.scope = s; render(); },
  dictGo() {
    const t = TK(DSEL.tid); if (!t) return;
    const sc = dictScopes(t), cur = sc.find(x => x.id === DSEL.scope) || sc[0];

    DSEL = null; view = 'dict'; dictPersist(); render();
  },
  dictSay() { if (DICT && DICT.list[DICT.i]) speak(W(DICT.list[DICT.i]).en); },
  dictSayWord(id) { if (DRES) speak(W(keyOf(DRES.tid, id)).en); },
  dtv(v) { if (DICT) DICT.cur = v; },
  dictSubmit() {
    if (!DICT || DICT.stage !== 'write' || DICT.mode === 'paper') return;

  },
  dictSkip() { if (!DICT || DICT.stage !== 'write') return; DICT.ans[DICT.i] = ''; App.dictAdvance(); },
  dictAdvance() {
    DICT.cur = ''; DICT.i++;

    dictPersist(); render();
  },
  dictEnd() {
    if (DICT.mode === 'paper') { DICT.stage = 'check'; DICT.i = Math.min(DICT.i, DICT.list.length - 1); if (!DICT.marks) DICT.marks = DICT.list.map(() => false); dictPersist(); render(); return; }
    dictFinish(DICT.list.map((k, i) => { const j = dictJudge(W(k), DICT.ans[i]); return { k, ans: DICT.ans[i] || '', ok: j.ok, caseWarn: j.caseWarn }; }));
  },
  dictNext() { if (!DICT) return; if (DICT.i + 1 >= DICT.list.length) { DICT.i = DICT.list.length; App.dictEnd(); return; } DICT.i++; dictPersist(); render(); },
  dictPrev() { if (!DICT || DICT.i <= 0) return; DICT.i--; DICT.spokenI = -1; dictPersist(); render(); },
  dictMark(i, bad) { if (!DICT || !DICT.marks) return; DICT.marks[i] = bad; dictPersist(); render(); },

  },
  dictRetry() {
    if (!DRES || !DRES.wrong.length) return;
    const tid = DRES.tid, list = shuffle(DRES.wrong.map(x => keyOf(tid, x.id)));
    const mode = (S.dictLog[S.dictLog.length - 1] || {}).mode || 'audio';
    DRES = null; DICT = { tid, mode, scope: 'last', list, ans: list.map(() => null), marks: null, i: 0, stage: 'write', cur: '', spokenI: -1 };
    view = 'dict'; dictPersist(); render();
  },
  shopPick(e) {
    const a = AV(e);
    if (S.avatars.includes(e)) { SHOPSEL = null; if (S.settings.avatar !== e) { S.settings.avatar = e; save(); toast(`换上了「${a.n}」`); } render(); return; }
    if (S.stars < a.tier.cost) { toast(`还差 ${a.tier.cost - S.stars} 颗星星，继续加油！`); return; }
    SHOPSEL = e; render(); try { window.scrollTo(0, 0); } catch (x) {}
  },
  shopBuy() {
    const a = SHOPSEL && AV(SHOPSEL); SHOPSEL = null;
    if (!a || S.avatars.includes(a.e) || S.stars < a.tier.cost) { render(); return; }
    S.stars -= a.tier.cost; S.avatars.push(a.e); S.settings.avatar = a.e; save();
    UNLOCK = a.e; sfx.done(); render(); try { window.scrollTo(0, 0); } catch (x) {}
    if (a.tier.id === 'leg') setTimeout(() => confetti(), 450);
  },
  unlockClose() { UNLOCK = null; render(); },
  shopCancel() { SHOPSEL = null; render(); },
  setNick(v) { S.settings.nick = String(v).trim().slice(0, 12) || '小勇士'; save(); toast('已保存昵称'); },
  setSpeak(v, el) { S.settings.speakOn = v; save(); segOn(el); },

  /* ---- 分享与导入 ---- */
  shareSel(tid) { STASK = tid; render(); const t = shareTask(); if (t && (!SHARE || SHARE.key !== shareKey(t))) buildShare(); },
  copyShare() { if (SHARE) copyText(shareText(), '已复制，可以粘贴到微信发给孩子的平板'); },
  sysShare() { if (SHARE && navigator.share) navigator.share({ title: '单词小勇士 · ' + SHARE.name, text: shareText() }).catch(() => {}); },
  copyPending() { if (PENDING) copyText('WH1:' + PENDING.code, '已复制，去桌面上的单词小勇士里粘贴吧'); },
  async importText() {
    const c = extractCode((document.getElementById('p_code') || {}).value);
    if (!c) { toast('没找到分享码，请把整段文字粘贴进来'); return; }
    if (await handleCode(c, false)) { view = 'import'; render(); }
  },
  pasteClip() { navigator.clipboard.readText().then(t => { const el = document.getElementById('p_code'); if (el) el.value = t; App.importText(); }).catch(() => toast('读不到剪贴板，请长按输入框手动粘贴')); },
  impMode(m) { IMP.mode = m; render(); },
  impTgt(v) { IMP.tgt = v; render(); },
  impName(v) { IMP.name = v; },
  applyImport() {
    const p = PENDING; if (!p) return;
    const ws = parseList(p.l); if (!ws.length) { toast('没有识别到单词'); return; }
    const cb = document.getElementById('imp_set'), useGrade = !!(cb && cb.checked);
    let msg;
    if (IMP.mode === 'merge' && S.tasks.length) {
      const t = TK(IMP.tgt) || S.tasks[0], before = t.words.length;
      t.rawList = t.rawList.trim() + '\n' + p.l.trim(); t.words = parseList(t.rawList);
      msg = `已合并到「${t.name}」：新增 ${t.words.length - before} 个，现在共 ${t.words.length} 个`;
    } else {
      const name = String(IMP.name || p.n || '新任务').trim().slice(0, 20) || '新任务';
      const used = new Set(S.tasks.map(t => t.icon));
      const t = newTask({ name, icon: ICONS.includes(p.i) ? p.i : (ICONS.find(i => !used.has(i)) || ICONS[0]),
        required: p.r != null ? !!p.r : !S.tasks.some(x => x.required), rawList: p.l, words: ws, newPerDay: p.d != null ? p.d : 5, deadline: p.dl });
      S.tasks.push(t); msg = `已新建任务「${t.name}」，共 ${ws.length} 个`;
    }
    if (useGrade && GRADE[p.g]) S.settings.grade = p.g;
    save(); PENDING = null; view = 'parent'; PTAB = 'tasks'; PEDIT = null; render(); toast(msg);
  },
  cancelImport() { PENDING = null; view = 'parent'; PTAB = 'share'; PEDIT = null; render(); },

  /* ---- 安装与备份 ---- */
  install() { if (!DEFER_PROMPT) return; DEFER_PROMPT.prompt(); DEFER_PROMPT.userChoice.finally(() => { DEFER_PROMPT = null; render(); }); },
  backup() {
    const a = document.createElement('a'); a.href = URL.createObjectURL(backupBlob()); a.download = backupName();
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    S.lastBackup = today(); save(); render(); toast('备份文件已下载');
  },
  backupShare() {
    const f = SHARE_AS === 'txt' ? new File([backupBlob()], backupName().replace(/\.json$/, '.txt'), { type: 'text/plain' }) : new File([backupBlob()], backupName(), { type: 'application/json' });
    navigator.share({ files: [f], title: backupName() }).then(() => { S.lastBackup = today(); save(); render(); }).catch(() => {});
  },
  restorePick(input) {
    const f = input.files && input.files[0]; input.value = ''; if (!f) return;
    f.text().then(t => {
      const d = JSON.parse(t);
      if (!d || d.app !== 'wordhero' || !d.state || !(Array.isArray(d.state.tasks) || Array.isArray(d.state.words))) throw 0;
      RESTORE = d; render();
    }).catch(() => toast('这不是单词小勇士的备份文件'));
  },
  restoreApply() { if (!RESTORE) return; const keep = S.seeds || []; S = normalize(RESTORE.state); S.seeds = [...new Set([...S.seeds, ...keep])]; RESTORE = null; save(); render(); toast('已从备份恢复'); },
  restoreCancel() { RESTORE = null; render(); },

  /* ---- 跟读 ---- */
  spStart() { startSpeech(); },
  spStop() {
    const t = SESS && curTask(); if (!t || !t.sp || t.sp.state !== 'listening') return;
    const sp = t.sp; sp.stopReq = true;
    if (sp.mode === 'sr') {
      if (!sp.started) {
        // 识别还没开始就点了"读完了"：等了 2 秒以上还没开始，说明引擎没反应
        if (Date.now() - (sp.t0 || 0) >= 2000) srToRec(t, 'no-response');
        else { stopSpeech(true); sp.state = 'idle'; render(); }
        return;
      }
      try { if (REC) REC.stop(); } catch (e) {}
      armStopWatch(t);
    } else {
      if (MR && MR.state === 'recording') { try { MR.stop(); } catch (e) {} }
      else if (!sp.started) { stopSpeech(true); sp.state = 'idle'; render(); return; }    // 还在等麦克风
      clearTimeout(SP_TIMER);
      clearTimeout(STOP_WATCH);
      STOP_WATCH = setTimeout(() => { if (spMine(t) && sp.state === 'listening') { stopSpeech(true); recDone(t); } }, 2000);
    }
  },
  spPlay() {
    const t = SESS && curTask(); if (!t || !t.sp || !t.sp.audio) return;
    cancelAuto(t); try { speechSynthesis.cancel(); } catch (e) {}
    t.sp.playing = 'mine'; render();
    playMine(t, () => { if (t.sp.playing === 'mine') { t.sp.playing = ''; if (spMine(t)) render(); } });
  },
  spPlayStd() {
    const t = SESS && curTask(); if (!t) return;
    if (!t.sp || t.sp.state === 'listening') { speak(W(t.id).en); return; }
    cancelAuto(t); stopPlay(); t.sp.playing = 'std'; render();
    speak(W(t.id).en, () => { if (t.sp.playing === 'std') { t.sp.playing = ''; if (spMine(t)) render(); } });
  },
  spCompare() { const t = SESS && curTask(); if (t && t.sp && t.sp.audio) playCompare(t, false); },
  spRetryMic() {
    const t = SESS && curTask(); if (!t || !t.sp) return;
    if (CAN_REC) { REC_STATE = 'unknown'; REC_ERR = ''; }
    t.sp.mode = pickSpMode(); t.sp.notice = ''; t.sp.state = 'idle';
    if (t.sp.mode === 'none') { t.sp.notice = NOTE_MIC; render(); return; }
    startSpeech();
  },
  spNext(self) {
    const t = curTask(); if (!t || t.type !== 'speak') return;
    stopSpeech(true); clearTimeout(CD_TIMER);
    const p = prog(t.id), sp = t.sp;
    if (self || sp.best >= 2) { p.spoke = true; SESS.stars++; addStars(1); }
    if (sp.audio) { URL.revokeObjectURL(sp.audio); sp.audio = null; }
    sp.playing = '';
    save(); next();
  },
  diagRun() { if (DIAG && DIAG.running) return; runDiag(); },
  diagPlay() { if (!DIAG || !DIAG.audio) return; stopPlay(); const a = new Audio(DIAG.audio); PLAYER = a; const pr = a.play(); if (pr && pr.catch) pr.catch(() => {}); },
  srReset() { delete S.settings.srBad; SR_STATE = SR ? 'unknown' : 'bad'; SR_ERR = SR ? '' : 'no-api'; save(); render(); toast('下次跟读时会重新尝试自动打分'); },

  /* ---- 测试与重置 ---- */
  rsel(tid) { RSEL = tid; render(); },
  ff() { S.dayOffset = (S.dayOffset || 0) + 1; save(); render(); toast(`已快进到 ${today()}`); },
  ffReset() { S.dayOffset = 0; save(); render(); toast('已回到真实日期'); },
  reset() {
    if (!resetArm) { resetArm = true; render(); return; }
    resetArm = false; S.tasks.forEach(t => { t.progress = {}; t.daily = null; }); S.resume = {};
    S.stars = 0; S.starsEarned = 0; S.avatars = FREE_AV.slice(); if (!FREE_AV.includes(S.settings.avatar)) S.settings.avatar = FREE_AV[0];
    S.streak = 0; S.lastStudy = null; S.dayOffset = 0; S.dictLog = []; S.dictBest = {};
    save(); render(); toast('学习进度已重置');
  }
};
window.App = App;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); DEFER_PROMPT = e; if (view === 'parent') render(); });
window.addEventListener('appinstalled', () => { DEFER_PROMPT = null; toast('已安装到桌面 🎉'); });
window.addEventListener('hashchange', checkHash);
if ('serviceWorker' in navigator && (location.protocol === 'https:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
if (isStandalone() && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
(function () {
  // 原创头像图片只放进样式表一次，浏览器解码一次就能反复用
  if (!window.WH_AVATARS) return;
  const st = document.createElement('style');
  const A = window.WH_AVATARS; st.textContent = Object.keys(A).map(k => `.avp-${k}{background-image:url(${A[k]})}`).join('\n');
  try { (document.head || document.body).appendChild(st); } catch (e) {}
})();
emjStart();
render();
checkHash();
TTS.boot();
</script>
